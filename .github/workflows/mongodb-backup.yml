name: MongoDB Backup

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:00 AM UTC = 5:00 AM Pakistan time
    - cron: "17 0 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB Database Tools
        run: |
          curl -L https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.18.0.tgz -o mongodb-tools.tgz
          tar -xzf mongodb-tools.tgz
          sudo cp mongodb-database-tools-ubuntu2204-x86_64-100.18.0/bin/* /usr/local/bin/

      - name: Verify mongodump
        run: mongodump --version

      - name: Set backup date
        id: date
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Create MongoDB Backup
        run: |
          mkdir -p backup
          mongodump \
            --uri="${{ secrets.MONGODB_URI }}" \
            --out="backup"

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_B64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Verify Google Drive
        run: |
          rclone lsd gdrive:

      - name: Upload MongoDB Backup to Google Drive
        run: |
          rclone copy backup "gdrive:MongoDB Backups/${{ steps.date.outputs.date }}" --create-empty-src-dirs -P

      - name: Verify Backup
        run: |
          rclone ls "gdrive:MongoDB Backups/${{ steps.date.outputs.date }}"

      - name: Delete backups older than 7 days
        run: |
          rclone delete "gdrive:MongoDB Backups" --min-age 7d -v
          rclone rmdirs "gdrive:MongoDB Backups" --leave-root -v

      - name: List remaining backups
        run: |
          rclone lsd "gdrive:MongoDB Backups"